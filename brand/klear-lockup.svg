  <circle cx="96" cy="56" r="7" fill="#3ED598"/>

  <text x="152" y="92"
        font-family="Helvetica, Arial, sans-serif"
        font-size="58" font-weight="600" letter-spacing="-1.5" fill="#101820">Klear</text>

  <text x="154" y="122"
        font-family="Helvetica, Arial, sans-serif"
        font-size="19" fill="#5B6B7A">every rupee, cleared.</text>
